services:
  - type: web
    name: budgetmate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: APP_FRONTEND_URL
        value: https://budgetmate-web.onrender.com
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://budgetmate-web.onrender.com
      - key: APP_OAUTH2_AUTHORIZED_REDIRECT_URI
        value: https://budgetmate-web.onrender.com/oauth2/redirect
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: static_site
    name: budgetmate-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://budgetmate-api.onrender.com/api/v1